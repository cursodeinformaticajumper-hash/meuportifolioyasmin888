<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Minha Biografia</title>
    <link rel="stylesheet" href="port.css">
    <script src="https://unpkg.com"></script>
    <style>
        /* Esta é a faixa escura/azul que fica no centro da tela */
        .container-central {
            background-color: rgba(15, 23, 42, 0.85); /* Fundo escuro azulado transparente */
            max-width: 750px;
            margin: 0 auto;
            min-height: 100vh;
            padding: 40px 45px;
            box-sizing: border-box;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.7);
            position: relative; /* Permite posicionar o gato do fone na lateral */
        }

        /* Estilo padrão da imagem redonda do personagem */
        .imagem-anime {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid #5971a3c4;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: block;
            margin: 0 auto 30px auto;
        }

        /* Hover da imagem */
        .imagem-anime:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px #5c77adb7;
            cursor: pointer;
        }

        /* Estilo do bloco de texto (Biografia) */
        .text {
            color: #ffffff;
        }

        /* Estilo do Título */
        .text h1 {
            text-align: center;
            font-size: 32px;
            margin-bottom: 30px;
            color: #799be0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .text h2 {
            text-align: center;
            font-size: 32px;
            margin-bottom: 30px;
            color: #c0cadd;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        /* Estilo dos Parágrafos em formato de TEXTO livro/corrido */
        .text p {
            font-size: 19px;
            text-align: justify;
            text-justify: inter-word;
            line-height: 1.8;
            margin-bottom: 25px;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.6);
            text-indent: 20px;
        }

        /* Estilo base para as imagens dos gatos */
        .squish-cat {
            position: relative;
            display: inline-block;
        }

        .squish-cat img {
            width: 150px;
            cursor: grab;
            transform-origin: center bottom;
            transition: transform 0.2s ease-in-out;
            display: block;
            background: transparent !important;
        }

        /* Animação de amassar quando passa o mouse */
        .squish-cat img:hover {
            animation: amassarGato 0.6s ease-in-out infinite alternate;
        }

        .squish-cat img:active {
            cursor: grabbing;
        }

        /* GATO 1: Fone de Ouvido (Configurações exclusivas para o GIF Esquerdo) */
        .gato-lateral-esquerdo {
            position: absolute;
            left: -250px;   /* Afasta o gatinho mais para a esquerda, fora da faixa azul */
            top: 320px;     /* Ajusta a altura dele na tela */
        }

        /* Altera o tamanho especificamente apenas do GIF esquerdo */
        .gato-lateral-esquerdo img {
            width: 220px !important; 
        }

        /* GATO 2: Gato Original (No final do site, abaixo do texto) */
        .gato-no-final {
            margin: 40px auto 10px auto;
            display: block;
            text-align: center;
            width: 150px;
        }

        /* Animações (Keyframes) */
        @keyframes amassarGato {
            0% { transform: scale(1, 1); }
            50% { transform: scale(1.15, 0.85); }
            100% { transform: scale(0.9, 1.1); }
        }

        @keyframes voarConfete {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(var(--dx), var(--dy)) scale(0.5);
                opacity: 0;
            }
        }

        /* ESTILOS DA SEÇÃO DE REDES SOCIAIS */
        .container-redes {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin: -10px auto 35px auto;
        }

        .icone-rede {
            color: #799be0;
            font-size: 36px;
            transition: transform 0.2s ease, color 0.2s ease, filter 0.2s ease;
            text-decoration: none;
        }

        /* Efeito interativo ao passar o mouse */
        .icone-rede:hover {
            color: #c0cadd;
            transform: scale(1.2);
            filter: drop-shadow(0 0 8px #5c77adb7);
        }

        /* ESTILOS DO MINI CALENDÁRIO */
        .calendario-mini {
            background-color: rgba(15, 23, 42, 0.9);
            border: 2px solid #5971a3c4;
            border-radius: 12px;
            padding: 12px;
            width: 200px;
            margin-top: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            font-family: 'EB Garamond', serif;
            color: #ffffff;
            user-select: none;
        }

        .calendario-titulo {
            font-size: 16px;
            font-weight: bold;
            color: #799be0;
            letter-spacing: 2px;
            margin-bottom: 8px;
            text-align: center;
        }

        .calendario-dias-semana {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            font-size: 11px;
            color: #c0cadd;
            font-weight: bold;
            margin-bottom: 5px;
            text-align: center;
        }

        .calendario-grade {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            font-size: 13px;
            text-align: center;
        }

        .calendario-grade span {
            display: block;
            height: 22px;
            line-height: 22px;
            border-radius: 4px;
        }

        .calendario-grade .dia-especial {
            background-color: #799be0;
            color: #0f172a;
            font-weight: bold;
            box-shadow: 0 0 10px #799be0;
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .calendario-grade .dia-especial:hover {
            transform: scale(1.2);
            background-color: #c0cadd;
            box-shadow: 0 0 15px #c0cadd;
        }
    </style>
</head>
